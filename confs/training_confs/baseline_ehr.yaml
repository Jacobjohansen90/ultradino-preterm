info:
  name: baseline

data:
  path: /projects/users/data/UCPH/DeepFetal/projects/preterm/Data/OnlyFirstPreg_June_v3/train.parquet
  test_path: /projects/users/data/UCPH/DeepFetal/projects/preterm/Data/OnlyFirstPreg_June_v3/test.parquet
  batch_size: 128
  val_frac: 0.05
  workers: 32
  # Risk / tabular columns (joined from ehr_*_path, or already in the parquet).
  ehr_data: ['ehr_pred']
  ehr_train_path: path/to/ehr_train.csv   # csv or parquet; join on CPR_CHILD
  ehr_test_path: path/to/ehr_test.csv     # same file if combined
  # ehr_id_column: CPR_CHILD  # join key in the EHR file; defaults to CPR_CHILD
  # drop_missing_ehr: false
  # Optional JSON patient encodings (keyed by CPR_CHILD):
  # ehr_encoding_train_path: path/to/train_encodings.json
  # ehr_encoding_test_path: path/to/test_encodings.json
  # ehr_encoding_dim: 128  # optional; inferred from JSON if omitted
  img_data: [physical_delta_x, physical_delta_y]
  img_size: [224, 224]
  oversample_ratio: 1 #0 = No oversampling
  label_smoothing_param: 2 #0 = No label smoothing

#remove / ignore / remove_on_GA 
#(Remove from DF if cond is true / ignore / remove if GA < GA_cutoff)
dataset: 
    progesterone: ignore 
    c-section: remove_on_GA
    induced: remove_on_GA

tasks:
  preterm:
    cutoffs: [34] #Sharp cutoff (GA < GA_cutoff)
    loss: 'bce'
    weights: [1]
  aux_tasks:
    - var: GA_weeks
      loss: 'l2'
      weights: 0.01

training:
  epochs: 60
  vit_frozen_until: 10  #VIT is frozen until this epoch
  ehr_frozen_until: 0 #EHR is frozen until this epoch
  #Unfreezeing strategy. Unfreeze blocks_per_step every_n_epochs until we reach top_n_blocks are unfrozen.
  #blocks_per_step = -1, top_n_blocks = -1 is all layers immediately
  #blocks_per_step = -1, top_n_blocks = N is top N layers immediately
  blocks_per_step: -1 
  every_n_epochs: 2
  top_n_blocks: -1
  
auxiliary:
  method: append

model:
  vit:
    type: vitb16
    #weights_path: /projects/users/data/UCPH/DeepFetal/projects/preterm/other_models/weights/vitb16.pth #VitB
    weights_path: /projects/users/data/UCPH/DeepFetal/projects/preterm/other_models/weights/oversampled_vitb16.pth 
    #weights_path: /projects/users/data/UCPH/DeepFetal/projects/preterm/other_models/weights/oversampled_vitl16.pth 
    dropout: 0.2
  
  ehr:
    # tabular | patient_lookup | patient_lookup_tabular | omit/null for no EHR
    # patient_lookup_tabular appends risk and encoding as two distinct token groups
    type: tabular
    # num_tokens: 4  # encoding → this many ViT tokens (default 1); risk stays 1 token
  
  transform:
    layer_dims: []

  head:
    layer_dims: []
    dropout: 0.2
    
optimizer:
  type: AdamW
  lr1: 5e-5 #Used while ViT is frozen
  lr2: 5e-6 #Used while ViT is unfrozen
  lr_decay: 0.65
  weight_decay: 1e-2

  #AdamW
  adamw_params: [0.9,0.999, 1e-8] #Beta1, Beta2, Epsilon
  
scheduler:
  type: cosine_warmup
  num_warmup_steps: 10
  num_cycles: 1 #A multiplier for the cosine scheduler. 2 means two cycles over training
  
device:
  type: cuda
