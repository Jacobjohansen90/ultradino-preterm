version: "dataset_v6"

paths:
  input_dir_SDS: /storage/archive/UCPH/DeepFetal/SDS/registers_pseudonymized/
  input_dir_SP: /storage/archive/UCPH/DeepFetal/SP/tables/
  misc_dir: /projects/users/data/UCPH/DeepFetal/projects/preterm/Data/misc/
  data_dir: /projects/users/data/UCPH/DeepFetal/projects/preterm/Data/
  SQL_DB: /projects/users/data/UCPH/DeepFetal/ultrasound/tables/DeepFetal_image_database_250526.sqlite
  holdout_csv: /projects/users/data/UCPH/DeepFetal/projects/common/splits/split_preterm_custom1/test_split_0_2026-08-24.csv
  segmentation_paths: /projects/users/data/UCPH/DeepFetal/ultrasound/segmentations/
  train_cfg: /projects/users/data/UCPH/DeepFetal/projects/preterm/ultradino-preterm/confs/criteria/AnyPreg.yaml
  test_cfg: /projects/users/data/UCPH/DeepFetal/projects/preterm/ultradino-preterm/confs/criteria/FirstPreg.yaml
  cervix_preds: /projects/users/data/UCPH/DeepFetal/projects/preterm/Data/misc/cervix_preds_v3.csv

population: 
  population_key: CPR_CHILD
  types: #By default column types are strings. If not listed here, it will be kept as string
    GA: int
    BIRTHDAY: date
  tables: 
    - table: ${paths.input_dir_SDS}/mfr.csv
      columns:
        CPR_CHILD: CPR_BARN
        CPR_MOTHER: CPR_MODER
        GA: GESTATIONSALDER_DAGE
        BIRTHDAY: FOEDSELSDATO
        BIRTH_ID: FOEDSELSLOEBENUMMER
    - table: ${paths.input_dir_SDS}/nyfoedte.csv
      columns:
        CPR_CHILD: CPRnummer_Barn
        CPR_MOTHER: CPRnummer_Mor
        GA: Gestationsalder
        BIRTHDAY: FoedselsDato_Barn
        BIRTH_ID: DW_EK_Foedsel
    - table: ${paths.data_dir}/tables/Population.csv
      columns:
        CPR_CHILD: BABY_CPR
        CPR_MOTHER: MOR_CPR
        GA: Gestationsalder
        BIRTHDAY: Fødselstidspunkt
        BIRTH_ID: BABY_Fødsel_ID

merge_tables:
    merges:
      - table: ${paths.input_dir_SDS}/t_sksube.csv
        merge_table: ${paths.input_dir_SDS}/t_adm.csv
        table_link: V_RECNUM
        merge_table_link: K_RECNUM
        include: [V_CPR]
      - table: ${paths.input_dir_SDS}/t_afl.csv
        merge_table: ${paths.input_dir_SDS}/t_adm.csv
        table_link: V_RECNUM
        merge_table_link: K_RECNUM
        include: [V_CPR]
      - table: ${paths.input_dir_SDS}/t_sksopr.csv
        merge_table: ${paths.input_dir_SDS}/t_adm.csv
        table_link: V_RECNUM
        merge_table_link: K_RECNUM
        include: [V_CPR]
      - table: ${paths.input_dir_SDS}/t_diag.csv
        merge_table: ${paths.input_dir_SDS}/t_adm.csv
        table_link: V_RECNUM
        merge_table_link: K_RECNUM
        include: [V_CPR, D_UDDTO]
      - table: ${paths.input_dir_SP}/Population.csv
        merge_table: ${paths.input_dir_SP}/Barn - Fødselsinfo.csv
        table_link: BABY_CPR
        merge_table_link: BABY_CPR
        include: [Gestationsalder]
      - table: ${paths.input_dir_SP}/Mor - Fødselsresume - DEL 1.csv
        merge_table: ${paths.input_dir_SP}/Population.csv
        table_link: BABY_Fødsel_ID
        merge_table_link: BABY_Fødsel_ID
        include: [BABY_CPR]

imaging:
  metadata_dicom_variables: 
    - ['manufacturer', 'str']
    - ['manufacturer_model_name', 'str']
    - ['study_date','date']
    - ['physical_delta_x', 'list']
    - ['physical_delta_y', 'list']
    - ['region_location_min_x0', 'list']
    - ['region_location_max_x1', 'list']
    - ['region_location_min_y0', 'list']
    - ['region_location_max_y1', 'list']

#Operators work as: column_1 [operator] column_2
merge:
  population_key: CPR_MOTHER
  create_variables:
    - var_name: "scan_to_delivery"
      var_type: days
      operator: "-"
      column_1: "BIRTHDAY"
      column_2: "study_date"
    - var_name: "GA_at_scan"
      var_type: int
      operator: "-"
      column_1: "GA"
      column_2: "scan_to_delivery"


    
